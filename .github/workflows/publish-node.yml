name: Publish node image

# Builds the one-command MapleCast node image (Dockerfile.node) and pushes it to
# GHCR. Manual (workflow_dispatch) or on changes to the node packaging. The
# built-in GITHUB_TOKEN carries packages:write, so no PAT is needed.

on:
  workflow_dispatch:
  push:
    paths:
      - 'Dockerfile.node'
      - 'deploy/node-entrypoint.sh'
      - '.github/workflows/publish-node.yml'

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (with submodules — flycast deps live in core/deps/**)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.node
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maplecast-node:latest
