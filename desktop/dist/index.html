<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapleCast</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #0b0d10; color: #cfd6df;
      font: 15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .box { text-align: center; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #4ea1ff; display: inline-block; margin-right: 6px;
      animation: pulse 1s infinite ease-in-out;
    }
    @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
    a { color: #4ea1ff; }
    small { color: #6b7580; }
  </style>
</head>
<body>
  <!--
    This local splash is what `build.frontendDist` bundles. The Rust shell
    (src/lib.rs -> setup) immediately navigates the window to the live client
    (MAPLECAST_URL, default https://nobd.net/webgpu-test.html?native=1), so
    this page is only visible for a blink while the remote client loads.
  -->
  <div class="box">
    <div><span class="dot"></span> Connecting to MapleCast…</div>
    <p><small>If this screen stays up, the client URL could not be reached.</small></p>
  </div>
</body>
</html>
